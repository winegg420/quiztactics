name: Testler

# Paket 26 C — kritik sunucu mantığının otomatik testleri.
# Node'un kendi test koşucusu (node:test) kullanılır; yeni npm paketi kurulmaz.
# `workflow_call` ile gece yedek akışı da bu işi çağırır.

# Push'ta ÇALIŞMAZ (23 Eyl 2026): doğrudan main'de gün içinde onlarca push var ve her
# koşu canlı veritabanına ~20 dk yük bindiriyordu — canlı sorgular 3-10 sn'ye çıktı.
# Gece yedek akışı (veritabani-yedek.yml, 03:00 TSİ) ve elle tetikleme çalıştırır.
on:
  workflow_dispatch:
  workflow_call:

# Sunucu testleri CANLI veritabanında işlem açıp geri alır. Sık push'larda aynı anda
# 5 koşu birbirini ve canlı sorguları kilitledi (23 Eyl 2026: Düello'da 57014 statement
# timeout). Aynı anda yalnız bir koşu; yeni push eskisini iptal eder.
concurrency:
  group: sunucu-testleri
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      # Sunucu testleri veritabanına bağlanır ve her şeyi ROLLBACK eder.
      # Sır tanımlı değilse o testler ATLANIR, iş kırılmaz.
      - name: Testler
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm test

      - name: Derleme (hub modu)
        run: npm run build
