<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#3D8CE8" />
    <!--
      KİMLİK ARTIK BURADA, STATİK.

      Eskiden bu dosya hub'ın (idaGG Game Center) kimliğini taşırdı ve Quiz
      Tactics'in başlık/paylaşım/manifest alanlarını `vite.config.js`'teki
      "bildim-modu" eklentisi derleme sırasında DEĞİŞTİRİRDİ. İki site tek
      depodan çıktığı için öyleydi. Quiz Tactics kendi deposuna taşındı;
      kimlik tek yerde, gözle görülür biçimde duruyor.
    -->
    <meta name="description" content="Türkçe bilgi yarışması: 1v1 meydan okuma, günlük turnuvalar, şehir ve ülke ligleri. Binlerce soru, ücretsiz." />
    <!-- Paylaşım kartları (WhatsApp, X, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quiz Tactics" />
    <meta property="og:title" content="Quiz Tactics — Bilgi Yarışması" />
    <meta property="og:description" content="Türkçe bilgi yarışması: 1v1 meydan okuma, günlük turnuvalar, şehir ve ülke ligleri. Binlerce soru, ücretsiz." />
    <meta property="og:url" content="https://quiztactics.com/" />
    <meta property="og:image" content="https://quiztactics.com/quiztactics-q-icon-512.png?v=20260930-q" />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Quiz Tactics — Bilgi Yarışması" />
    <meta name="twitter:description" content="Türkçe bilgi yarışması: 1v1 meydan okuma, günlük turnuvalar, şehir ve ülke ligleri." />
    <meta name="twitter:image" content="https://quiztactics.com/quiztactics-q-icon-512.png?v=20260930-q" />
    <!--
      Manifest adı geriye uyumluluk için korundu. Eski bildim-icon-* dosyaları
      yüklü PWA'ların geri dönüşü için durur; aktif ikonlar önbellek kıran
      quiztactics-sekerq-* yollarıdır (24 Eyl 2026: Şeker Q; eski quiztactics-wordmark-* dosyaları durur).
    -->
    <link rel="manifest" href="/bildim.webmanifest?v=20260930-q" />
    <link rel="icon" type="image/svg+xml" href="/quiztactics-q-favicon.svg?v=20260930-q" />
    <link rel="icon" type="image/png" sizes="32x32" href="/quiztactics-q-favicon-32.png?v=20260930-q" />
    <link rel="icon" type="image/png" sizes="192x192" href="/quiztactics-q-icon-192.png?v=20260930-q" />
    <link rel="apple-touch-icon" sizes="180x180" href="/quiztactics-q-apple-touch-180.png?v=20260930-q" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quiz Tactics" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Şenlik tasarım dili: başlık/buton/skor Baloo 2, gövde metni Nunito.
         İkisi de Türkçe karakterleri tam destekliyor. -->
    <!-- Arayuz Yenileme (20 Eyl 2026): yazi tipleri YEREL paketlendi
         (public/fonts/). Google Fonts baglantisi kaldirildi - dis bagimlilik
         ve ilk yukleme gecikmesi istenmiyor. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/baloo-2-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/nunito-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/yazitipleri.css" />
    <!-- JavaScript ve uygulama stilleri inerken boş ekran gösterme. React ilk
         çizimde bu küçük, metinsiz marka yükleyicisini kendiliğinden değiştirir. -->
    <style>
      #qt-ilk-yukleme{box-sizing:border-box;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:#eef4ff;color:#3D8CE8}
      #qt-ilk-yukleme>span{display:grid;place-items:center;gap:14px}
      #qt-ilk-yukleme img{display:block;width:68px;height:68px}
      .qt-ilk-noktalar{display:flex;gap:7px}
      .qt-ilk-noktalar i{width:9px;height:9px;border-radius:50%;background:currentColor;animation:qt-ilk-nokta 1s ease-in-out infinite}
      .qt-ilk-noktalar i:nth-child(2){animation-delay:.12s}.qt-ilk-noktalar i:nth-child(3){animation-delay:.24s}
      @keyframes qt-ilk-nokta{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
      @media (prefers-reduced-motion:reduce){.qt-ilk-noktalar i{animation:none;opacity:.62}}
    </style>
    <title>Quiz Tactics — Bilgi Yarışması</title>
  </head>
  <body>
    <div id="root"><div id="qt-ilk-yukleme" role="status" aria-busy="true" aria-label="Quiz Tactics"><span><img src="/quiztactics-q-favicon.svg?v=20260930-q" width="68" height="68" alt="" /><span class="qt-ilk-noktalar" aria-hidden="true"><i></i><i></i><i></i></span></span></div></div>
    <script type="module" src="/src/baslat.js"></script>
  </body>
</html>
